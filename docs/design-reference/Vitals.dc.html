<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foundry Vitals</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@600;700&display=swap">
<style>
body{margin:0;background:#08120d}
.tab{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;background:none;border:0;padding:0;color:#8fa596;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #08120d; color: #e9f1ea; font-family: 'Barlow', sans-serif; overflow: hidden">
<div style="flex-grow: 1; box-sizing: border-box; padding: 60px 24px 0; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; justify-content: space-between">
<svg width="48" height="48" viewBox="0 0 48 48" fill="none" role="img" aria-label="Vitals">
<path d="M24 2l19 11v22L24 46 5 35V13z" fill="#0f1d15" stroke="{{accent}}" stroke-width="2" stroke-linejoin="round"/>
<g transform="translate(12 12)" stroke="{{accent}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 4 10 2-5h6"/></g>
</svg>
<div style="display: flex; align-items: center; gap: 8px; height: 44px; box-sizing: border-box; padding: 0 16px; border: 1px solid #1f3a2a; border-radius: 999px; background: #0f1d15; color: {{accent}}; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em" role="img" aria-label="Synced with Apple Health">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>
<span>HEALTH SYNCED</span>
</div>
</div>

<div style="display: flex; justify-content: center">
<div style="position: relative; width: 208px; height: 208px">
<svg width="208" height="208" viewBox="0 0 208 208" fill="none" aria-hidden="true">
<circle cx="104" cy="104" r="92" stroke="#1f3a2a" stroke-width="12"/>
<circle cx="104" cy="104" r="92" stroke="{{accent}}" stroke-width="12" stroke-linecap="round" stroke-dasharray="520 578" transform="rotate(-90 104 104)"/>
<circle cx="104" cy="104" r="72" stroke="#16281d" stroke-width="1.5"/>
</svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
<div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 48px; line-height: 1">7h 12m</div>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #93a89a">OF 8H GOAL</div>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; height: 14px; border-radius: 7px; overflow: hidden; gap: 2px" role="img" aria-label="Sleep stages: deep 1h 20m, core 3h 55m, REM 1h 40m, awake 17m">
<div style="width: 18.5%; background: #1d5a3a"></div>
<div style="width: 54.4%; background: #3f9a62"></div>
<div style="width: 23.1%; background: #9be3b4"></div>
<div style="width: 4%; background: #e0616d"></div>
</div>
<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.06em; color: #93a89a">
<span>DEEP 1:20</span><span>CORE 3:55</span><span>REM 1:40</span><span>AWAKE 0:17</span>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 48px; border: 1px solid {{accent}}; border-radius: 14px; background: #0f1d15; color: {{accent}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3L5 13h6l-1 8 8-10h-6z"/></svg>
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.06em">RECOVERY 82% · ×1.2 XP TODAY</span>
</div>

<div style="display: flex; gap: 12px">
<div style="flex: 1 1 0; padding: 14px; background: #0f1d15; border: 1px solid #1f3a2a; border-radius: 14px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #93a89a">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e0616d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>
<span>RESTING</span>
</div>
<div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; line-height: 1">58 <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 400; font-size: 12px; color: #93a89a">BPM</span></div>
</div>
<div style="flex: 1 1 0; padding: 14px; background: #0f1d15; border: 1px solid #1f3a2a; border-radius: 14px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #93a89a">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>
<span>WORKOUTS</span>
</div>
<div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; line-height: 1">3 <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 400; font-size: 12px; color: #93a89a">OF 4</span></div>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; height: 78px" role="img" aria-label="Workout minutes this week: Monday 40, Wednesday 46, Thursday 42, other days none yet">
<div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%"><div style="width: 100%; height: 40px; border-radius: 6px; background: #2c5a3f"></div><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #93a89a">M</span></div>
<div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%"><div style="width: 100%; height: 4px; border-radius: 2px; background: #1f3a2a"></div><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #93a89a">T</span></div>
<div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%"><div style="width: 100%; height: 46px; border-radius: 6px; background: #2c5a3f"></div><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #93a89a">W</span></div>
<div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%"><div style="width: 100%; height: 42px; border-radius: 6px; background: {{accent}}"></div><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #e9f1ea">T</span></div>
<div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%"><div style="width: 100%; height: 4px; border-radius: 2px; background: #1f3a2a"></div><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #93a89a">F</span></div>
<div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%"><div style="width: 100%; height: 4px; border-radius: 2px; background: #1f3a2a"></div><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #93a89a">S</span></div>
<div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%"><div style="width: 100%; height: 4px; border-radius: 2px; background: #1f3a2a"></div><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #93a89a">S</span></div>
</div>

</div>
<nav style="display: flex; height: 88px; box-sizing: border-box; padding: 6px 8px 26px; background: #0b1810; border-top: 1px solid #1f3a2a">
<button class="tab" aria-label="Foundry"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 9h-4.5v9h-5v-9H5z"/></svg><span>Foundry</span></button>
<button class="tab" aria-label="The List"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v18M12 8h4M12 12h4"/></svg><span>List</span></button>
<button class="tab" aria-label="The Quiver"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 20L18 8M9 20L21 8M3 17L15 5"/></svg><span>Quiver</span></button>
<button class="tab" aria-label="Training"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v18M16 3v18M8 7h8M8 12h8M8 17h8"/></svg><span>Train</span></button>
<button class="tab" aria-label="Vitals" style="color: {{accent}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg><span>Vitals</span></button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#62c47f","options":["#62c47f","#7fd6a0","#4fae6d"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#62c47f' };
  }
}
</script>
</body>
</html>
