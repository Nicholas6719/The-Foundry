<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foundry Quiver</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@600;700&display=swap">
<style>
body{margin:0;background:#08120d}
.tab{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;background:none;border:0;padding:0;color:#8fa596;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.hab{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:0;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;color:#93a89a;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #08120d; color: #e9f1ea; font-family: 'Barlow', sans-serif; overflow: hidden">
<div style="flex-grow: 1; box-sizing: border-box; padding: 60px 24px 0; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; justify-content: space-between">
<svg width="48" height="48" viewBox="0 0 48 48" fill="none" role="img" aria-label="The Quiver">
<path d="M24 2l19 11v22L24 46 5 35V13z" fill="#0f1d15" stroke="{{accent}}" stroke-width="2" stroke-linejoin="round"/>
<g transform="translate(12 12)" stroke="{{accent}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20L18 8M9 20L21 8M3 17L15 5"/></g>
</svg>
<div style="display: flex; align-items: center; gap: 8px; height: 44px; box-sizing: border-box; padding: 0 16px; border: 1px solid #1f3a2a; border-radius: 999px; background: #0f1d15; color: {{accent}}; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.06em" role="img" aria-label="Three of four arrows fired">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 19L19 5M19 5h-6M19 5v6"/></svg>
<span>3 / 4</span>
</div>
</div>

<div style="display: flex; justify-content: center">
<svg width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-label="Target with three arrows lodged near the bullseye">
<circle cx="150" cy="150" r="140" fill="#0f1d15" stroke="#2b4536" stroke-width="2"/>
<circle cx="150" cy="150" r="105" fill="#13241a" stroke="#2b4536" stroke-width="2"/>
<circle cx="150" cy="150" r="70" fill="#0f1d15" stroke="#2b4536" stroke-width="2"/>
<circle cx="150" cy="150" r="35" fill="#13241a" stroke="#2b4536" stroke-width="2"/>
<circle cx="150" cy="150" r="12" fill="#e0616d"/>

<g transform="translate(130 160) rotate(-30)" stroke="{{accent}}" stroke-width="4" stroke-linecap="round">
<path d="M0 0V-96"/><path d="M0 -84l-9 -13M0 -84l9 -13M0 -96l-9 -13M0 -96l9 -13" stroke-width="3"/>
</g>
<g transform="translate(176 136) rotate(24)" stroke="{{accent}}" stroke-width="4" stroke-linecap="round">
<path d="M0 0V-96"/><path d="M0 -84l-9 -13M0 -84l9 -13M0 -96l-9 -13M0 -96l9 -13" stroke-width="3"/>
</g>
<g transform="translate(148 186) rotate(150)" stroke="{{accent}}" stroke-width="4" stroke-linecap="round">
<path d="M0 0V-96"/><path d="M0 -84l-9 -13M0 -84l9 -13M0 -96l-9 -13M0 -96l9 -13" stroke-width="3"/>
</g>
</svg>
</div>

<div style="display: flex; justify-content: space-between; padding: 4px 4px 0">
<button class="hab" aria-label="Train, fired">
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="{{accent}}"/><g transform="translate(20 20)" stroke="#07110c" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></g></svg>
<span>TRAIN</span>
</button>
<button class="hab" aria-label="Eat on plan, fired">
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="{{accent}}"/><g transform="translate(20 20)" stroke="#07110c" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M4 12c0 4 3.5 7 8 7s8-3 8-7M8 8c0-2 1.5-4 4-4s4 2 4 4"/></g></svg>
<span>EAT</span>
</button>
<button class="hab" aria-label="Read, fired">
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="{{accent}}"/><g transform="translate(20 20)" stroke="#07110c" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z"/></g></svg>
<span>READ</span>
</button>
<button class="hab" aria-label="Sleep on time, ready to fire" style="color: {{accent}}">
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#0f1d15" stroke="{{accent}}" stroke-width="2.5"/><circle cx="32" cy="32" r="30" stroke="{{accent}}" stroke-opacity="0.25" stroke-width="8"/><g transform="translate(20 20)" stroke="{{accent}}" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></g></svg>
<span>SLEEP</span>
</button>
</div>

<div style="display: flex; justify-content: space-between; padding: 12px 8px 0; border-top: 1px solid #1f3a2a">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><svg width="26" height="26" viewBox="0 0 30 30" role="img" aria-label="Monday: bullseye"><circle cx="15" cy="15" r="13" fill="{{accent}}"/><circle cx="15" cy="15" r="8.5" fill="none" stroke="#08120d" stroke-width="1.5"/><circle cx="15" cy="15" r="3.5" fill="#08120d"/></svg><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #93a89a">M</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><svg width="26" height="26" viewBox="0 0 30 30" role="img" aria-label="Tuesday: bullseye"><circle cx="15" cy="15" r="13" fill="{{accent}}"/><circle cx="15" cy="15" r="8.5" fill="none" stroke="#08120d" stroke-width="1.5"/><circle cx="15" cy="15" r="3.5" fill="#08120d"/></svg><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #93a89a">T</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><svg width="26" height="26" viewBox="0 0 30 30" role="img" aria-label="Wednesday: bullseye"><circle cx="15" cy="15" r="13" fill="{{accent}}"/><circle cx="15" cy="15" r="8.5" fill="none" stroke="#08120d" stroke-width="1.5"/><circle cx="15" cy="15" r="3.5" fill="#08120d"/></svg><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #93a89a">W</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><svg width="26" height="26" viewBox="0 0 30 30" fill="none" role="img" aria-label="Thursday: in progress"><circle cx="15" cy="15" r="12" stroke="#1f3a2a" stroke-width="3"/><circle cx="15" cy="15" r="12" stroke="{{accent}}" stroke-width="3" stroke-linecap="round" stroke-dasharray="56.5 75.4" transform="rotate(-90 15 15)"/></svg><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #e9f1ea">T</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><svg width="26" height="26" viewBox="0 0 30 30" fill="none" role="img" aria-label="Friday: upcoming"><circle cx="15" cy="15" r="12" stroke="#3a5646" stroke-width="1.5" stroke-dasharray="3 4"/></svg><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #93a89a">F</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><svg width="26" height="26" viewBox="0 0 30 30" fill="none" role="img" aria-label="Saturday: upcoming"><circle cx="15" cy="15" r="12" stroke="#3a5646" stroke-width="1.5" stroke-dasharray="3 4"/></svg><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #93a89a">S</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><svg width="26" height="26" viewBox="0 0 30 30" fill="none" role="img" aria-label="Sunday: upcoming"><circle cx="15" cy="15" r="12" stroke="#3a5646" stroke-width="1.5" stroke-dasharray="3 4"/></svg><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #93a89a">S</span></div>
</div>

</div>
<nav style="display: flex; height: 88px; box-sizing: border-box; padding: 6px 8px 26px; background: #0b1810; border-top: 1px solid #1f3a2a">
<button class="tab" aria-label="Foundry"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 9h-4.5v9h-5v-9H5z"/></svg><span>Foundry</span></button>
<button class="tab" aria-label="The List"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v18M12 8h4M12 12h4"/></svg><span>List</span></button>
<button class="tab" aria-label="The Quiver" style="color: {{accent}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 20L18 8M9 20L21 8M3 17L15 5"/></svg><span>Quiver</span></button>
<button class="tab" aria-label="Training"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v18M16 3v18M8 7h8M8 12h8M8 17h8"/></svg><span>Train</span></button>
<button class="tab" aria-label="Vitals"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg><span>Vitals</span></button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#62c47f","options":["#62c47f","#7fd6a0","#4fae6d"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#62c47f' };
  }
}
</script>
</body>
</html>
