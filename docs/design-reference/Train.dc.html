<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foundry Training</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@600;700&display=swap">
<style>
body{margin:0;background:#08120d}
.tab{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;background:none;border:0;padding:0;color:#8fa596;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #08120d; color: #e9f1ea; font-family: 'Barlow', sans-serif; overflow: hidden">
<div style="flex-grow: 1; box-sizing: border-box; padding: 60px 24px 0; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; justify-content: space-between">
<svg width="48" height="48" viewBox="0 0 48 48" fill="none" role="img" aria-label="Training">
<path d="M24 2l19 11v22L24 46 5 35V13z" fill="#0f1d15" stroke="{{accent}}" stroke-width="2" stroke-linejoin="round"/>
<g transform="translate(12 12)" stroke="{{accent}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v18M16 3v18M8 7h8M8 12h8M8 17h8"/></g>
</svg>
<div style="display: flex; align-items: center; gap: 8px; height: 44px; box-sizing: border-box; padding: 0 16px; border: 1px solid #1f3a2a; border-radius: 999px; background: #0f1d15; color: {{accent}}; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.06em" role="img" aria-label="Push day, synced from Apple Watch">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>
<span>PUSH</span>
</div>
</div>

<div style="display: flex; align-items: center; gap: 14px; padding: 16px; background: #0f1d15; border: 1px solid #1f3a2a; border-radius: 16px">
<svg width="190" height="320" viewBox="0 0 190 320" fill="none" role="img" aria-label="Salmon ladder: the bar sits on the 155 pound rung, 160 is next">
<path d="M30 8V316M120 8V316" stroke="#2b4536" stroke-width="6" stroke-linecap="round"/>
<path d="M30 40H120" stroke="#3a5646" stroke-width="3" stroke-dasharray="3 5"/>
<path d="M30 90H120" stroke="#3a5646" stroke-width="3" stroke-dasharray="3 5"/>
<path d="M30 140H120" stroke="{{accent}}" stroke-width="3" stroke-linecap="round"/>
<path d="M30 240H120M30 290H120" stroke="#2c5a3f" stroke-width="4" stroke-linecap="round"/>
<path d="M66 124l9-9 9 9" stroke="{{accent}}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="12" y="182" width="148" height="16" rx="8" fill="{{accent}}"/>
<rect x="6" y="172" width="12" height="36" rx="4" fill="#e9f1ea"/>
<rect x="154" y="172" width="12" height="36" rx="4" fill="#e9f1ea"/>
<g font-family="IBM Plex Mono, monospace" font-size="12" fill="#93a89a">
<text x="138" y="44">170</text>
<text x="138" y="94">165</text>
<text x="138" y="144" fill="{{accent}}">160</text>
<text x="138" y="244">150</text>
<text x="138" y="294">145</text>
</g>
</svg>
<div style="flex: 1 1 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px">
<div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 76px; line-height: 0.9; color: {{accent}}">155</div>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.1em; color: #93a89a">LB · RUNG 4</div>
<div style="display: flex; gap: 6px; padding-top: 14px" role="img" aria-label="Three of three sets complete">
<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="8" fill="{{accent}}"/></svg>
<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="8" fill="{{accent}}"/></svg>
<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="8" fill="{{accent}}"/></svg>
</div>
<div style="display: flex; align-items: center; gap: 6px; padding-top: 14px; color: {{accent}}; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
<span>NEXT 160</span>
</div>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="padding: 14px; background: #0f1d15; border: 1px solid #1f3a2a; border-radius: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 0.04em">BENCH</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-label="Done"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
</div>
<div style="display: flex; gap: 6px"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="7" fill="{{accent}}"/></svg><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="7" fill="{{accent}}"/></svg><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="7" fill="{{accent}}"/></svg></div>
</div>
<div style="padding: 14px; background: #0f1d15; border: 1px solid #1f3a2a; border-radius: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 0.04em">INCLINE</span>
</div>
<div style="display: flex; gap: 6px"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="7" fill="{{accent}}"/></svg><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="7" fill="{{accent}}"/></svg><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="6" stroke="#93a89a" stroke-width="1.5"/></svg></div>
</div>
<div style="padding: 14px; background: #0f1d15; border: 1px solid #1f3a2a; border-radius: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 0.04em">PRESS</span>
</div>
<div style="display: flex; gap: 6px"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="6" stroke="#93a89a" stroke-width="1.5"/></svg><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="6" stroke="#93a89a" stroke-width="1.5"/></svg><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="6" stroke="#93a89a" stroke-width="1.5"/></svg></div>
</div>
<div style="padding: 14px; background: #0f1d15; border: 1px solid #1f3a2a; border-radius: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 0.04em">PUSHDOWN</span>
</div>
<div style="display: flex; gap: 6px"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="6" stroke="#93a89a" stroke-width="1.5"/></svg><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="6" stroke="#93a89a" stroke-width="1.5"/></svg><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="6" stroke="#93a89a" stroke-width="1.5"/></svg></div>
</div>
</div>

</div>
<nav style="display: flex; height: 88px; box-sizing: border-box; padding: 6px 8px 26px; background: #0b1810; border-top: 1px solid #1f3a2a">
<button class="tab" aria-label="Foundry"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 9h-4.5v9h-5v-9H5z"/></svg><span>Foundry</span></button>
<button class="tab" aria-label="The List"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v18M12 8h4M12 12h4"/></svg><span>List</span></button>
<button class="tab" aria-label="The Quiver"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 20L18 8M9 20L21 8M3 17L15 5"/></svg><span>Quiver</span></button>
<button class="tab" aria-label="Training" style="color: {{accent}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v18M16 3v18M8 7h8M8 12h8M8 17h8"/></svg><span>Train</span></button>
<button class="tab" aria-label="Vitals"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg><span>Vitals</span></button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#62c47f","options":["#62c47f","#7fd6a0","#4fae6d"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#62c47f' };
  }
}
</script>
</body>
</html>
