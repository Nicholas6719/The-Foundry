<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foundry List</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@600;700&display=swap">
<style>
body{margin:0;background:#08120d}
.tab{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;background:none;border:0;padding:0;color:#8fa596;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #08120d; color: #e9f1ea; font-family: 'Barlow', sans-serif; overflow: hidden">
<div style="flex-grow: 1; box-sizing: border-box; padding: 60px 24px 0; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; justify-content: space-between">
<svg width="48" height="48" viewBox="0 0 48 48" fill="none" role="img" aria-label="The List">
<path d="M24 2l19 11v22L24 46 5 35V13z" fill="#0f1d15" stroke="{{accent}}" stroke-width="2" stroke-linejoin="round"/>
<g transform="translate(12 12)" stroke="{{accent}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v18M12 8h4M12 12h4"/></g>
</svg>
<div style="display: flex; align-items: center; gap: 8px; height: 44px; box-sizing: border-box; padding: 0 16px; border: 1px solid #1f3a2a; border-radius: 999px; background: #0f1d15" role="img" aria-label="Two of five names struck">
<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="#e0616d"/></svg>
<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="#e0616d"/></svg>
<svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5.5" stroke="#93a89a" stroke-width="1.5"/></svg>
<svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5.5" stroke="#93a89a" stroke-width="1.5"/></svg>
<svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5.5" stroke="#93a89a" stroke-width="1.5"/></svg>
</div>
</div>

<div style="position: relative; box-sizing: border-box; padding: 20px 20px 20px 52px; background: #e9e3cf; border-radius: 6px 16px 16px 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.5)">
<svg style="position: absolute; left: 14px; top: 20px" width="22" height="420" viewBox="0 0 22 420" aria-hidden="true">
<circle cx="11" cy="20" r="6" fill="#08120d"/><circle cx="11" cy="72" r="6" fill="#08120d"/><circle cx="11" cy="124" r="6" fill="#08120d"/><circle cx="11" cy="176" r="6" fill="#08120d"/><circle cx="11" cy="228" r="6" fill="#08120d"/><circle cx="11" cy="280" r="6" fill="#08120d"/><circle cx="11" cy="332" r="6" fill="#08120d"/><circle cx="11" cy="384" r="6" fill="#08120d"/>
</svg>

<div style="display: flex; align-items: center; justify-content: space-between; height: 76px; border-bottom: 1px solid rgba(60, 80, 60, 0.25)">
<span style="font-family: 'Caveat', cursive; font-weight: 700; font-size: 36px; line-height: 1; color: #1a2018; padding: 4px 16px; border: 3px solid #b3202e; border-radius: 46px 40px 44px 38px / 34px 38px 32px 36px">Ship the side project</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; color: #b3202e">FRI</span>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; height: 76px; border-bottom: 1px solid rgba(60, 80, 60, 0.25)">
<span style="font-family: 'Caveat', cursive; font-weight: 700; font-size: 36px; line-height: 1; color: #1a2018; padding-left: 19px">Call the dentist</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; color: #4a5044">TODAY</span>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; height: 76px; border-bottom: 1px solid rgba(60, 80, 60, 0.25)">
<span style="font-family: 'Caveat', cursive; font-weight: 700; font-size: 36px; line-height: 1; color: #1a2018; padding-left: 19px">Read 20 pages</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; color: #4a5044">TODAY</span>
</div>

<div style="display: flex; align-items: center; height: 76px; border-bottom: 1px solid rgba(60, 80, 60, 0.25)">
<span style="font-family: 'Caveat', cursive; font-weight: 700; font-size: 36px; line-height: 1; color: #6b6f60; padding-left: 19px; text-decoration: line-through; text-decoration-color: #b3202e; text-decoration-thickness: 4px">Cancel the subscription</span>
</div>

<div style="display: flex; align-items: center; height: 76px">
<span style="font-family: 'Caveat', cursive; font-weight: 700; font-size: 36px; line-height: 1; color: #6b6f60; padding-left: 19px; text-decoration: line-through; text-decoration-color: #b3202e; text-decoration-thickness: 4px">Meal prep Sunday</span>
</div>
</div>

<div style="display: flex; justify-content: center; padding-top: 4px">
<button aria-label="Add a name to the List" style="width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: {{accent}}; border: 0; color: #07110c; cursor: pointer">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>
</div>

</div>
<nav style="display: flex; height: 88px; box-sizing: border-box; padding: 6px 8px 26px; background: #0b1810; border-top: 1px solid #1f3a2a">
<button class="tab" aria-label="Foundry"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 9h-4.5v9h-5v-9H5z"/></svg><span>Foundry</span></button>
<button class="tab" aria-label="The List" style="color: {{accent}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v18M12 8h4M12 12h4"/></svg><span>List</span></button>
<button class="tab" aria-label="The Quiver"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 20L18 8M9 20L21 8M3 17L15 5"/></svg><span>Quiver</span></button>
<button class="tab" aria-label="Training"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v18M16 3v18M8 7h8M8 12h8M8 17h8"/></svg><span>Train</span></button>
<button class="tab" aria-label="Vitals"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg><span>Vitals</span></button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#62c47f","options":["#62c47f","#7fd6a0","#4fae6d"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#62c47f' };
  }
}
</script>
</body>
</html>
