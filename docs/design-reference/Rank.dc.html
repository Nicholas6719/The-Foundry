<g transform="translate(12 12)" stroke="{{accent}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11l6-6 6 6M6 18l6-6 6 6"/></g>

</svg>
</div>

<svg width="64" height="64" viewBox="0 0 64 64" fill="none" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#0f1d15" stroke="#3a5646" stroke-width="2" stroke-dasharray="4 4"/><g transform="translate(20 20)" stroke="#93a89a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v18M12 8h4M12 12h4"/></g></svg>
<span>TEN STRUCK</span>

</div>
<nav style="display: flex; height: 88px; box-sizing: border-box; padding: 6px 8px 26px; background: #0b1810; border-top: 1px solid #1f3a2a">

<button class="tab" aria-label="The List"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v18M12 8h4M12 12h4"/></svg><span>List</span></button>
